name: Deploy to GitHub Pages

# main 에 push 될 때마다 site/ 를 새로 빌드해서 배포
on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩 (진행 중인 건 취소하지 않음)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # papers.py export 는 표준 라이브러리만 사용 → pip install 불필요
      - name: Build static site
        run: |
          python papers.py export
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
