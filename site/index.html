<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Library</title>
<style>
[hidden] { display: none !important; }
@import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg:#f7f5f1; --bg2:#eeece6; --sidebar:#151827; --sidebar2:#1e2238;
  --ink:#1c1e2b; --ink2:#5a5d72; --border:#d8d5ce; --s-border:#2a2e42;
  --s-ink:#c8cce0; --s-ink2:#6b7094; --accent:#4f63d2; --accent2:#3a4db8;
  --tag-bg:#e8e5de; --star:#f5a623; color-scheme:light;
}
[data-theme="dark"] {
  --bg:#13141a; --bg2:#1a1b24; --ink:#e0e2f0; --ink2:#8085a8;
  --border:#2a2e42; --tag-bg:#22253a; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}

#shell{display:grid;grid-template-columns:272px 1fr;grid-template-rows:100vh;height:100vh;}
#shell.has-shots{grid-template-columns:272px 1fr 220px;}

#sidebar{background:var(--sidebar);color:var(--s-ink);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--s-border);}
.sb-head{padding:18px 16px 10px;border-bottom:1px solid var(--s-border);flex-shrink:0;}
.sb-wordmark{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--s-ink2);margin-bottom:4px;}
.sb-title{font-family:'Spectral',serif;font-size:16px;font-weight:600;color:#e8eaf6;margin-bottom:10px;}
#search{width:100%;background:var(--sidebar2);border:1px solid var(--s-border);border-radius:6px;color:var(--s-ink);font-size:12px;padding:6px 10px;outline:none;}
#search::placeholder{color:var(--s-ink2);}

.filter-toggle-btn{width:100%;text-align:left;background:none;border:none;color:var(--s-ink2);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--s-border);}
.filter-toggle-btn:hover{color:var(--s-ink);}
.filter-arrow{display:inline-block;transition:transform .2s;}
.filter-toggle-btn.open .filter-arrow{transform:rotate(90deg);}

#filter-panel{border-bottom:1px solid var(--s-border);flex-shrink:0;overflow:hidden;max-height:0;transition:max-height .25s ease;}
#filter-panel.open{max-height:400px;}

.sb-sort{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 8px;}
.sort-btn{background:none;border:1px solid var(--s-border);border-radius:4px;color:var(--s-ink2);font-size:11px;padding:3px 7px;cursor:pointer;}
.sort-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.filter-group{padding:6px 16px;}
.filter-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--s-ink2);margin-bottom:4px;}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;}
.fchip{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--sidebar2);color:var(--s-ink2);cursor:pointer;border:1px solid var(--s-border);}
.fchip:hover,.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);}

.active-filters{padding:0 16px;display:flex;flex-wrap:wrap;gap:4px;}
.active-filters.visible{padding:6px 16px;}
.af-chip{font-size:11px;background:#3a4060;color:#c0c4e0;padding:2px 6px;border-radius:10px;display:flex;align-items:center;gap:4px;}
.af-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:12px;line-height:1;}

.sb-count{font-size:10px;color:var(--s-ink2);padding:4px 16px 2px;flex-shrink:0;}

#paper-list{list-style:none;overflow-y:auto;flex:1;padding:6px 0 16px;}
#paper-list::-webkit-scrollbar{width:4px;}
#paper-list::-webkit-scrollbar-thumb{background:var(--s-border);border-radius:2px;}
.pl-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--s-border);transition:background .12s;}
.pl-item:hover{background:var(--sidebar2);}
.pl-item.active{background:#1e2a50;border-left:3px solid var(--accent);}
.pl-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.pl-year{font-size:10px;color:var(--s-ink2);}
.pl-venue-tag{font-size:10px;background:var(--sidebar2);border:1px solid var(--s-border);padding:1px 6px;border-radius:8px;color:var(--s-ink2);}
.pl-title{font-size:12px;color:#e0e2f0;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pl-authors{font-size:10px;color:var(--s-ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-stars{font-size:10px;color:var(--star);margin-top:2px;}
.pl-empty{padding:20px 16px;color:var(--s-ink2);font-size:12px;text-align:center;}

#main{overflow:hidden;display:flex;flex-direction:column;}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:40px;}
#welcome svg{opacity:.2;}
#welcome h2{font-family:'Spectral',serif;font-size:22px;color:var(--ink);opacity:.45;}
#welcome p{font-size:13px;max-width:260px;line-height:1.6;color:var(--ink2);}
#paper-view{flex:1;overflow-y:auto;padding:32px 40px 60px;}
#paper-view::-webkit-scrollbar{width:5px;}
#paper-view::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

.pv-eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.pv-title{font-family:'Spectral',serif;font-size:24px;font-weight:600;line-height:1.3;margin-bottom:12px;}
.pv-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
.pill{font-size:12px;background:var(--tag-bg);border-radius:6px;padding:3px 10px;color:var(--ink2);}
a.pill{color:var(--accent);text-decoration:none;}
a.pill:hover{text-decoration:underline;}

.pv-rating{display:flex;align-items:center;gap:4px;margin-bottom:12px;}
.star-btn{background:none;border:none;cursor:pointer;font-size:20px;padding:0 1px;color:#ccc;transition:color .1s;line-height:1;}
.star-btn.on{color:var(--star);}
.star-btn:hover{color:var(--star);}
.rating-label{font-size:11px;color:var(--ink2);margin-left:6px;}

.aff-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.aff-tag{font-size:11px;background:#e8f0fe;color:#3050a0;border-radius:6px;padding:2px 8px;}
[data-theme="dark"] .aff-tag{background:#1e2a50;color:#7090d0;}
.kw-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.kw{font-size:11px;background:var(--tag-bg);color:var(--ink2);border-radius:10px;padding:2px 8px;}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;padding:7px 14px;font-size:13px;color:var(--ink2);margin-bottom:-1px;}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500;}
.tab-pane{display:none;}
.tab-pane.on{display:block;}

.prose{font-size:14px;line-height:1.7;color:var(--ink);}
.prose h2{font-family:'Spectral',serif;font-size:18px;margin:20px 0 8px;}
.prose h3{font-size:14px;font-weight:600;margin:16px 0 6px;}
.prose p{margin-bottom:10px;}
.prose ul{padding-left:20px;margin-bottom:10px;}
.prose li{margin-bottom:4px;}
.prose code{background:var(--tag-bg);padding:1px 5px;border-radius:3px;font-size:12px;}
.prose img{max-width:100%;border-radius:6px;margin:8px 0;cursor:zoom-in;}
.prose strong{font-weight:600;}
.prose hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
.empty-note{color:var(--ink2);font-size:13px;padding:20px 0;}
.empty-note code{background:var(--tag-bg);padding:2px 6px;border-radius:3px;}

#shots-panel{border-left:1px solid var(--border);overflow-y:auto;background:var(--bg2);padding:12px 8px;display:flex;flex-direction:column;gap:8px;}
#shots-panel::-webkit-scrollbar{width:4px;}
#shots-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.shot-card img{width:100%;border-radius:6px;cursor:zoom-in;border:1px solid var(--border);display:block;}
.shot-label{font-size:10px;color:var(--ink2);margin-top:3px;text-align:center;}
.shots-header{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px;text-align:center;}

#theme-btn{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--ink2);z-index:10;}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;}

@media(max-width:700px){
  #shell,#shell.has-shots{grid-template-columns:1fr;}
  #sidebar{height:40vh;}
  #shots-panel{display:none;}
  #paper-view{padding:18px 18px 40px;}
}
</style>
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-wordmark">Research Library</div>
      <div class="sb-title">Paper Collection</div>
      <input id="search" type="search" placeholder="Search titles, authors, keywords..."
             oninput="Q.query=this.value; renderList()" autocomplete="off">
    </div>
    <button class="filter-toggle-btn" id="filter-toggle" onclick="toggleFilters()">
      <span class="filter-arrow">&#x25B6;</span>&nbsp; Sort &amp; Filter
    </button>
    <div id="filter-panel">
      <div class="sb-sort">
        <button class="sort-btn on" data-s="added"     onclick="setSort(this,'added')">Added</button>
        <button class="sort-btn"    data-s="year_desc" onclick="setSort(this,'year_desc')">Year &#x2193;</button>
        <button class="sort-btn"    data-s="year_asc"  onclick="setSort(this,'year_asc')">Year &#x2191;</button>
        <button class="sort-btn"    data-s="title"     onclick="setSort(this,'title')">A&#x2013;Z</button>
        <button class="sort-btn"    data-s="rating"    onclick="setSort(this,'rating')">&#x2605; Stars</button>
      </div>
      <div class="filter-group">
        <div class="filter-label">Venue</div>
        <div class="chip-row" id="venue-chips"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Keywords</div>
        <div class="chip-row" id="kw-chips"></div>
      </div>
    </div>
    <div class="active-filters" id="active-filters"></div>
    <div class="sb-count" id="sb-count"></div>
    <ul id="paper-list"></ul>
  </aside>
  <main id="main">
    <div id="welcome">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <h2>Select a paper</h2>
      <p>Use the sidebar to browse, sort, and filter your collection.</p>
    </div>
    <div id="paper-view" hidden></div>
  </main>
  <div id="shots-panel" hidden></div>
</div>
<button id="theme-btn" onclick="toggleTheme()">&#x25D0;</button>

<script>

const Q = { query: '', sort: 'added', venues: new Set(), kws: new Set() };
let activeKey = null;
let PAPERS = [];

function stripYear(v) { return v.replace(/\s*['`]?\d{2,4}$/, '').trim(); }

function filtered() {
  let list = [...PAPERS];
  const q = Q.query.toLowerCase().trim();
  if (q) list = list.filter(p =>
    p.title.toLowerCase().includes(q) ||
    p.authors.toLowerCase().includes(q) ||
    (p.keywords||[]).some(k => k.toLowerCase().includes(q)) ||
    (p.venue_short||'').toLowerCase().includes(q) ||
    (p.venue_full||'').toLowerCase().includes(q) ||
    (p.affiliations||[]).some(a => a.toLowerCase().includes(q)) ||
    String(p.year).includes(q)
  );
  if (Q.venues.size) list = list.filter(p => Q.venues.has(stripYear(p.venue_short||'')));
  if (Q.kws.size)    list = list.filter(p => (p.keywords||[]).some(k => Q.kws.has(k)));
  const cmp = {
    added:     (a,b) => (a.add_order||0) - (b.add_order||0),
    year_desc: (a,b) => b.year - a.year,
    year_asc:  (a,b) => a.year - b.year,
    title:     (a,b) => a.title.localeCompare(b.title),
    venue:     (a,b) => (a.venue_short||'').localeCompare(b.venue_short||''),
    rating:    (a,b) => (b.rating||4) - (a.rating||4),
  };
  list.sort(cmp[Q.sort] || cmp.added);
  return list;
}

function setSort(btn, key) {
  Q.sort = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('on', b.dataset.s === key));
  renderList();
}

function toggleFilters() {
  document.getElementById('filter-panel').classList.toggle('open');
  document.getElementById('filter-toggle').classList.toggle('open');
}

function toggleVenue(v) { Q.venues.has(v) ? Q.venues.delete(v) : Q.venues.add(v); renderList(); }
function toggleKw(k)    { Q.kws.has(k)    ? Q.kws.delete(k)    : Q.kws.add(k);    renderList(); }

function starsStr(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= n ? '★' : '☆';
  return s;
}

function renderList() {
  const list = filtered();
  const ul = document.getElementById('paper-list');
  if (!list.length) {
    ul.innerHTML = '<li class="pl-empty">No papers match.</li>';
  } else {
    ul.innerHTML = list.map(p =>
      '<li class="pl-item' + (activeKey===p.key?' active':'') + '" data-key="' + p.key + '" onclick="openPaper(\'' + p.key + '\')">' +
        '<div class="pl-meta">' +
          '<span class="pl-year">' + p.year + '</span>' +
          '<span class="pl-venue-tag">' + stripYear(p.venue_short||'') + '</span>' +
        '</div>' +
        '<div class="pl-title">' + escHtml(p.title) + '</div>' +
        '<div class="pl-authors">' + escHtml(p.authors||'') + '</div>' +
        '<div class="pl-stars">' + starsStr(p.rating||4) + '</div>' +
      '</li>'
    ).join('');
  }
  document.getElementById('sb-count').textContent = list.length + ' of ' + PAPERS.length + ' papers';

  const af = document.getElementById('active-filters');
  af.innerHTML = '';
  const mkChip = (label, rmFn) => {
    const span = document.createElement('span'); span.className = 'af-chip';
    span.textContent = label + ' ';
    const btn = document.createElement('button'); btn.textContent = '\xd7';
    btn.addEventListener('click', rmFn);
    span.appendChild(btn); af.appendChild(span);
  };
  Q.venues.forEach(v => mkChip(v, () => { Q.venues.delete(v); renderList(); }));
  Q.kws.forEach(k => mkChip(k, () => { Q.kws.delete(k); renderList(); }));
  af.className = 'active-filters' + (af.children.length ? ' visible' : '');
}

function buildFilterChips() {
  const baseVenues = [...new Set(PAPERS.map(p => stripYear(p.venue_short||'')))].sort();
  const vcRow = document.getElementById('venue-chips');
  vcRow.innerHTML = '';
  baseVenues.forEach(v => {
    const el = document.createElement('span');
    el.className = 'fchip'; el.dataset.v = v; el.textContent = v;
    el.addEventListener('click', () => toggleVenue(v));
    vcRow.appendChild(el);
  });
  const freq = {};
  PAPERS.forEach(p => (p.keywords||[]).forEach(k => { freq[k] = (freq[k]||0)+1; }));
  const topKws = Object.entries(freq).sort((a,b) => b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,16);
  const kwRow = document.getElementById('kw-chips');
  kwRow.innerHTML = '';
  topKws.forEach(([k,n]) => {
    const el = document.createElement('span');
    el.className = 'fchip'; el.dataset.k = k;
    el.innerHTML = escHtml(k) + (n>1 ? ' <small style="opacity:.6">'+n+'</small>' : '');
    el.addEventListener('click', () => toggleKw(k));
    kwRow.appendChild(el);
  });
}

function switchTab(btn, id) {
  btn.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('on'));
  document.getElementById('tab-'+id).classList.add('on');
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function md(src) {
  if (!src) return '';
  src = src.replace(/<!--[\s\S]*?-->/g, '');
  src = src.replace(/^#{1,2} (.+)$/gm, '<h2>$1</h2>');
  src = src.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  src = src.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  src = src.replace(/\*(.+?)\*/g, '<em>$1</em>');
  src = src.replace(/`(.+?)`/g, '<code>$1</code>');
  src = src.replace(/^---+$/gm, '<hr>');
  src = src.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  return src.split(/\n\n+/).map(b => {
    b = b.trim(); if (!b) return '';
    if (/^<(h[123]|hr|li|ul)/.test(b)) return b.includes('<li>') ? '<ul>'+b+'</ul>' : b;
    return '<p>'+b.replace(/\n/g,' ')+'</p>';
  }).join('\n');
}

function lightbox(src) {
  const d = document.createElement('div');
  d.className = 'lightbox';
  const img = document.createElement('img'); img.src = src;
  d.appendChild(img); d.onclick = () => d.remove(); document.body.appendChild(d);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
}

function renderShots(imgs, keyName, baseUrl) {
  const panel = document.getElementById('shots-panel');
  const shell = document.getElementById('shell');
  if (!imgs || !imgs.length) {
    panel.hidden = true;
    shell.classList.remove('has-shots');
    return;
  }
  panel.hidden = false;
  shell.classList.add('has-shots');
  panel.innerHTML = '<div class="shots-header">Screenshots</div>' +
    imgs.map(function(s, i) {
      const src = baseUrl ? baseUrl + s : 'imgs/' + keyName + '/' + s;
      return '<div class="shot-card"><img src="' + src + '" onclick="lightbox(this.src)" alt="' + escHtml(s) + '">' +
        '<div class="shot-label">' + (i+1) + ' / ' + imgs.length + '</div></div>';
    }).join('');
}

function starsEditHtml(key, rating) {
  let h = '<div class="pv-rating">';
  for (let i = 1; i <= 5; i++) {
    h += '<button class="star-btn' + (i<=rating?' on':'') + '" onclick="setRating(\'' + key + '\',' + i + ')" title="' + i + ' star' + (i>1?'s':'') + '">' + (i<=rating?'★':'☆') + '</button>';
  }
  h += '<span class="rating-label">' + rating + ' / 5</span></div>';
  return h;
}

try {
  const t = localStorage.getItem('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(e) {}

(function() {
  function init(papers) {
    PAPERS = papers;
    buildFilterChips();
    renderList();
  }
  fetch('papers.json')
    .then(function(r){ return r.json(); })
    .then(init)
    .catch(function() { init([
  {
    "key": "rhys2025beyond",
    "title": "Beyond Productivity: Rethinking the Impact of Creativity Support Tools",
    "authors": "Rhys Cox, Samuel and B{o}jer Djernes, Helena and van Berkel, Niels",
    "year": 2025,
    "venue_short": "C&C '25",
    "venue_full": "Proceedings of the 2025 Conference on Creativity and Cognition",
    "doi": "10.1145/3698061.3726924",
    "abstract": "Creativity Support Tools (CSTs) are widely used across diverse creative domains, with generative AI recently increasing the abilities of CSTs. To better understand how the success of CSTs is determined in the literature, we conducted a review of outcome measures used in CST evaluations. Drawing from (n=173) CST evaluations in the ACM Digital Library, we identified the metrics commonly employed to assess user interactions with CSTs. Our findings reveal prevailing trends in current evaluation practices, while exposing underexplored measures that could broaden the scope of future research. Based on these results, we argue for a more holistic approach to evaluating CSTs, encouraging the HCI community to consider not only user experience and the quality of the generated output, but also user-centric aspects such as self-reflection and well-being as critical dimensions of assessment. We also highlight a need for validated measures specifically suited to the evaluation of generative AI in CSTs.",
    "keywords": [
      "Creativity",
      "Creativity Support Tools (CSTs)",
      "Literature Review",
      "Evaluation Measures",
      "Outcome Measures"
    ],
    "affiliations": [
      "Aalborg University"

    "notes": "**Authors:** Rhys Cox, Samuel and B{\\o}jer Djern{\\ae}s, Helena and van Berkel, Niels\n**Year:** 2025\n**Venue:** Proceedings of the 2025 Conference on Creativity and Cognition\n**DOI:** 10.1145/3698061.3726924\n\n---\n\n## Notes\n\n\n\n## Key Points\n\n- \n\n## Relevance",
    "ai": "<!-- AI Analysis: rhys2025beyond – 2026-09-10 16:47 -->\n<!-- See also: [rhys2025beyond.md](rhys2025beyond.md) -->\n\n# AI Analysis: Beyond Productivity: Rethinking the Impact of Creativity Support Tools\n\n_User notes: [rhys2025beyond.md](rhys2025beyond.md)_ · [Full PDF](rhys2025beyond.pdf)\n\n---\n\n## Summary\nThis paper presents a systematic review of outcome measures used in 173 empirical studies of Creativity Support Tools (CSTs) from the ACM Digital Library (2015–2024). The authors find that while user experience (90%) and creative artefact quality (54%) are frequently measured, user-centric benefits like well-being, self-reflection, and skill development are rarely assessed (15%). They argue for a more holistic approach to CST evaluation that considers benefits to users themselves, not just productivity outcomes.\n\n## Affiliations\nSamuel Rhys Cox, Helena Bøjer Djernæs, Niels van Berkel - Department of Computer Science, Aalborg University, Denmark\n\n<Aalborg University>\n\n## Core Contributions\n- Systematic categorization of CST outcome measures into three themes: User Experience with CST, Creative Artefact Quality, and User-Centric Benefits\n- Identification of a significant gap in research: only 15% of studies measure user-centric benefits (learning, well-being, self-reflection, self-perception)\n- Documentation of prevalent reliance on ad hoc measures, particularly for evaluating human-AI collaboration in CSTs\n- Call for validated measures specifically suited to evaluating generative AI in creativity contexts\n- Comprehensive mapping of 173 papers across measure types, venues, and years (2015-2024)\n\n## Methodology\n- **Scope:** 10-year review (2015-2024) of ACM Digital Library publications\n- **Search Strategy:** Searched \"creativity support tool\" anywhere in publication + \"creativity\" as keyword\n- **Initial Results:** 1,241 papers screened down to 173 included papers\n- **Analysis:** Two researchers conducted thematic analysis using open coding to extract outcome measures\n- **Inclusion Criteria:** Empirical evaluations of user interactions with CSTs, including human-AI co-creativity tools\n- **Exclusion Criteria:** Formative work, fully automated systems, taxonomy development, observational-only studies, insufficient measure descriptions\n\n## Key Findings\n- **User Experience (90% of studies):** General usability measures dominated (n=101), with SUS (n=20) and CSI (n=50) being common validated scales; many ad hoc measures used\n- **Creative Artefact Quality (54%):** Well-established measures from creativity literature (fluency, flexibility, originality, elaboration from TTCT); human ratings and quantitative content analysis\n- **User-Centric Benefits (15%):** Included intrinsic abilities (n=13), emotional well-being (n=6), self-reflection (n=6), self-perception (n=5); often used pre/post-test designs\n- **Generative AI Gap:** Studies evaluating human-AI collaboration increasingly rely on ad hoc measures, indicating need for validated scales addressing ownership, agency, and collaboration dynamics\n- **Publication Trends:** CHI (n=55), C&C (n=28), DIS (n=16), UIST (n=16) were top venues\n\n## Limitations & Future Work\n**Limitations:**\n- Review limited to ACM Digital Library only; other repositories (IEEE Xplore, Science Direct) may contain additional measures\n- Definition of CST varies across literature; authors chose to include co-creative AI systems\n- Exploratory studies excluded, which may contain user-centric measures not captured\n\n**Future Directions:**\n- Development of validated measures for human-AI co-creativity experiences\n- Greater emphasis on longitudinal studies to assess behavior change and well-being outcomes\n- Integration of measures from conversational user interface (CUI) research\n- Adoption of user-centric outcomes informed by health/arts research (citing Fancourt & Finn's WHO scoping review)\n\n## Connection to User Notes\nThe user's notes are empty—no key points, relevance, or personal annotations were provided. The paper would be relevant to researchers interested in: (1) methodology for evaluating creative AI tools, (2) human-AI collaboration in creative contexts, (3) well-being and personal benefits of creative technology use, or (4) systematic review methodology in HCI.\n\n## Related Work Cited\n- **Frich et al. (2019)** - \"Mapping the Landscape of Creativity Support Tools in HCI\" - foundational CST review covering methodological approaches\n- **Cherry & Latulipe (2014)** - Creativity Support Index (CSI) - most widely adopted validated measure for creativity support evaluation\n- **Fancourt & Finn (2019)** - WHO scoping review on arts and health/well-being - provides foundation for user-centric benefits\n- **Remy et al. (2020)** - Prior review of CST evaluation methodologies (differentiated from current work's focus on outcome measures)\n- **Lawton et al. (2023)** - Mixed-Initiative Creativity Support Index (MICSI) - extends CSI for human-AI co-creation contexts\n\n---\n\n## Screenshots\n\n![rhys2025beyond_01.png](rhys2025beyond_01.png)\n\n---\n_Generated 2026-09-10 by Claude (model: claude-opus-4-5)_\n",

    "notes": "**Authors:** Chung, Jaeryung and Kim, Seon Gyeom and Lee, Tak Yeon\n**Year:** 2025\n**Venue:** Proceedings of the Extended Abstracts of the CHI Conference on Human Factors in Computing Systems\n**DOI:** 10.1145/3706599.3719932\n\n---\n\n## Notes\n\n\n\n## Key Points\n\n- \n\n## Relevance",
    "ai": "<!-- AI Analysis: chung2025wrighthere – 2026-09-10 16:50 -->\n<!-- See also: [chung2025wrighthere.md](chung2025wrighthere.md) -->\n\n# AI Analysis: WrightHere: Supporting Children's Creative Writing with AI-Infused Interactive 3D Environment\n\n_User notes: [chung2025wrighthere.md](chung2025wrighthere.md)_ · [Full PDF](chung2025wrighthere.pdf)\n\n---\n\n## Summary\nWrightHere is a generative AI-infused creative writing system that generates interactive 3D environments from children's written stories, allowing users to explore scenes, interact with characters through dialogue, and gather inspiration to overcome writer's block. The system supports the cyclical nature of creative writing through two modes—Writer Mode for composition and Dive-in Mode for exploration—enabling seamless transitions between imagination and story creation.\n\n## Affiliations\n**Jaeryung Chung** - Department of Industrial Design, KAIST\n**Seon Gyeom Kim** - Department of Industrial Design, KAIST\n**Tak Yeon Lee** - Department of Industrial Design, KAIST\n\n<KAIST>\n\n## Core Contributions\n- A novel dual-mode writing system integrating AI-generated 3D environments (Writer Mode + Dive-in Mode) to support creative writing's cyclical planning-translating process\n- Story Materials system that captures dialogues, memos, and characters from 3D exploration for later use in writing via drag-and-drop co-writing\n- Real-time generation pipeline combining 360° environment generation, 3D character mesh creation, text-to-speech dialogue, and context-aware background music selection\n- Demonstration of how spatial exploration and character interaction can catalyze narrative development and emotional engagement in children\n\n## Methodology\n- **System built:** Unity-based application using ChatGPT-4o as central controller, Skybox AI for 360° environments, Meshy API for 3D characters, NAVER HyperCLOVA X for TTS, and Musicfy-generated music library (9 tracks)\n- **Study design:** Qualitative user study with one-hour story creation sessions followed by exploratory interviews\n- **Participants:** 6 participants (4 elementary school students ages 9-12, 1 middle school student age 14, 1 high school student age 18)\n- **Metrics:** Qualitative feedback through open-ended questions about positive/negative experiences; behavioral observations during use\n\n## Key Findings\n- Scene exploration and generation were the most frequently used features; participants developed narratives through spatial exploration and iterative scene refinement\n- Character interactions drove both emotional engagement (P1 created companion for lonely character) and story progression (P2 asked sword \"Can I fly with you?\")\n- Younger participants showed more unconstrained imagination with AI, treating characters as autonomous beings; older participants had more specific output expectations\n- Story Materials effectively bridged ideation and writing—participants used memos to overcome writer's block while maintaining creative agency\n- Processing speed directly impacted feature usage (faster scene generation used more than slower character creation)\n\n## Limitations & Future Work\n- **Limitations acknowledged:** Qualitative-only findings; PC-based interface limits full spatial interaction; Korean language users only; short one-hour sessions; VR version developed but unusable due to child hardware constraints\n- **Future directions:** Quantitative measures (writing performance, confidence, ideation capacity); optimized generation speeds; more diverse audio options and customizable character aesthetics; cross-cultural/linguistic studies; longer-term engagement; future VR implementation when child-friendly hardware improves\n\n## Connection to User Notes\nThe user notes are empty with no key points or relevance filled in. The paper presents a creative writing support system for children combining generative AI with interactive 3D environments—this may be relevant to research on AI-assisted creativity tools, child-computer interaction, or multimodal writing interfaces.\n\n## Related Work Cited\n- Flower & Hayes (1981) - \"A Cognitive Process Theory of Writing\" (theoretical foundation for planning/translating stages)\n- Gero, Long & Chilton (2023) - \"Social Dynamics of AI Support in Creative Writing\" (AI in creative writing cycles)\n- Qin et al. (2024) - \"CharacterMeet: Supporting Creative Writers' Entire Story Character Construction Processes\" (LLM-powered character interaction)\n- Fan et al. (2024) - \"StoryPrompt: Exploring the Design Space of an AI-Empowered Creative Storytelling System for Elementary Children\"\n- Gonçalves & Campos (2018) - \"Mild Place Illusion: A Virtual Reality Factor to Spark Creativity in Writing\" (VR for creative writing)\n\n---\n\n## Screenshots\n\n_No screenshots yet._\n\n---\n_Generated 2026-09-10 by Claude (model: claude-opus-4-5)_\n",

    "abstract": "Today, Artificial Intelligence (AI) is prevalent in everyday life, with emerging technologies like AI companions, autonomous vehicles, and AI art tools poised to significantly transform the future. The development of AI curricula that shows people how AI works and what they can do with it is a powerful way to prepare everyone, and especially young learners, for an increasingly AI-driven world. Educators often employ robotic toolkits in the classroom to boost engagement and learning. However, these platforms are generally unsuitable for young learners and learners without programming expertise. Moreover, these platforms often serve as either programmable artifacts or pedagogical agents, rarely capitalizing on the opportunity to support students in both capacities. We designed Doodlebot, a mobile social robot for hands-on AI education to address these gaps. Doodlebot is an effective tool for exploring AI with grade school (K-12) students, promoting their understanding of AI concepts such as perception, representation, reasoning and generation. We begin by elaborating Doodlebot's design, highlighting its reliability, user-friendliness, and versatility. Then, we demonstrate Doodlebot's versatility through example curricula about AI character design, autonomous robotics, and generative AI accessible to young learners. Finally, we share the results of a preliminary user study with elementary school youth where we found that the physical Doodlebot platform was as effective and user-friendly as the virtual version. This work offers insights into designing interactive educational robots that can inform future AI curricula and tools.",
